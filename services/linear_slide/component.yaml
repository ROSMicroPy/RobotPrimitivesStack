contract_version: "0.2"
package:
  name: rube-goldberg-linear-slide
  version: 0.2.0
  import: LinearSlide
  entry_point: LinearSlide:LinearSlide
dependencies:
  motor-control: ">=0.2.0,<1.0.0"
  distance-sensor: ">=0.2.0,<1.0.0"
components:
  LinearSlide:
    description: System-specific closed-loop slide composed from reusable components.
    binds:
      joint: {urdf_type: prismatic, required: true}
      motor_driver: {component: MotorController, driver: step_dir}
      position_observer: {component: DistanceSensorController, driver: vl53l4cd}
    operations:
      get_position:
        implementation: get_position
        returns: {type: integer, unit: mm}
        concurrency: read_only
      goto_position:
        implementation: goto_position
        args:
          position_mm: {type: integer, unit: mm}
        cancellable: true
        errors: [target_out_of_range, maximum_steps_exceeded, sensor_read_failed, move_cancelled]
      stop:
        implementation: stop
        idempotent: true
      shutdown:
        implementation: shutdown
        idempotent: true
    safe_state: stop
