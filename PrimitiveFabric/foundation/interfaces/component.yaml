manifest: rp.service/v1
package:
  name: rp-interfaces
  version: 0.1.0
  import: rpstack.interfaces

service:
  name: rp-interfaces
  version: 0.1.0
  kind: interface_library
  type: runtime.capability_interfaces
  description: Hardware-independent lifecycle, measurement, observer, and actuator contracts.
  capabilities: {provides: [], requires: {}}
  configuration: {}
  lifecycle: {}
  operations: {}
  signals: {}
  implementations: {}
  tests: {}

interfaces:
  sensing.distance_observer:
    version: 1
    operation: observe_distance
    returns: {type: DistanceSample, quantity: distance, canonical_unit: m}
  motion.position_observer:
    version: 1
    operation: observe_position
    returns:
      type: PositionSample
      quantities: [linear, angular]
      canonical_units: {linear: m, angular: rad}
  motion.motion_actuator:
    version: 1
    operations: [command, stop]
  motion.position_actuator:
    version: 1
    operations: [move_to, stop]
