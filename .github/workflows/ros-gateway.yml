name: ROS gateway
on:
  push:
    paths: ['ros2/**', 'SomaticMesh/behaviors/ros_gateway/**', 'SomaticMesh/runtime/**', 'SomaticMesh/foundation/**', 'SomaticMesh/services/**', 'SomaticMesh/transports/ros_signals/**', 'examples/ros_slide/**', 'examples/slide_nodes/**', 'examples/robie1/**', '.github/workflows/ros-gateway.yml']
  pull_request:
    paths: ['ros2/**', 'SomaticMesh/behaviors/ros_gateway/**', 'SomaticMesh/runtime/**', 'SomaticMesh/foundation/**', 'SomaticMesh/services/**', 'SomaticMesh/transports/ros_signals/**', 'examples/ros_slide/**', 'examples/slide_nodes/**', 'examples/robie1/**', '.github/workflows/ros-gateway.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ros-jazzy:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install interface build dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions ros-jazzy-diagnostic-msgs ros-jazzy-sensor-msgs
      - name: Build interfaces and run real ROS tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths ros2 --build-base /tmp/somatic_mesh-build --install-base /tmp/somatic_mesh-install
          source /tmp/somatic_mesh-install/setup.bash
          python3 -c 'import rclpy; from somatic_mesh_interfaces.action import MoveLinear'
          python3 -B -m unittest discover -s SomaticMesh/behaviors/ros_gateway/test -v
