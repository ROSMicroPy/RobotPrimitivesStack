name: Documentation Pages
on:
  push:
    paths: ['docs/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
          persist-credentials: false
          sparse-checkout: docs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/requirements.txt
      - name: Build and check documentation links
        run: python docs/build.py
      - name: Check committed site is current
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "Run python docs/build.py and commit the generated files."
            git status --short -- docs
            git diff --stat -- docs
            exit 1
          fi
      - name: Package static site
        run: |
          mkdir -p docs/_site
          cp docs/*.html docs/search.json docs/.nojekyll docs/_site/
          cp -R docs/assets docs/_site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
