name: Documentation Pages
on:
  push:
    paths: ['docs/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/requirements.txt
      - name: Build and check documentation links
        run: python docs/build.py
      - name: Check committed site is current
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "Run python docs/build.py and commit the generated files."
            git status --short -- docs
            git diff --stat -- docs
            exit 1
          fi
